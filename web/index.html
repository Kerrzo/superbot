<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SuperBot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn" id="search-btn" title="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        </button>
        <button class="icon-btn" id="new-btn" title="New Bot">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <input class="search" id="search" placeholder="Search Bots" hidden />

      <button class="primary-bot" id="primary-bot"></button>

      <div class="teams-heading">
        <span>Teams</span>
        <button type="button" id="new-team" class="team-icon" title="New team" aria-label="New team">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <nav class="bot-list" id="bot-list" aria-label="Bots by team"></nav>

      <button class="hidden-bots" id="hidden-btn">
        <span id="hidden-label">Hidden Bots</span><span id="hidden-count"></span>
      </button>

      <div class="sidebar-bottom">
        <div class="me">
          <div class="me-avatar" id="me-avatar"></div>
          <span id="me-name"></span>
        </div>
        <button type="button" class="icon-btn" id="mcp-open" title="MCP Services" aria-label="MCP Services">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M17 14v6M14 17h6"/></svg>
        </button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <button type="button" class="bot-pill" id="bot-pill" aria-controls="details" aria-expanded="false"></button>
        <button class="share-btn screen-btn" id="screen-btn" title="Watch this Bot's screen">Screen</button>
        <button class="share-btn">Share</button>
      </header>

      <section class="messages" id="messages" aria-label="Conversation">
        <div class="chat-history" id="chat-history"></div>
        <div class="msg-row bot" id="chat-draft" hidden><div class="bubble markdown" id="draft-body"></div></div>
        <div class="msg-row bot" id="chat-progress" hidden><div class="bubble typing"><span></span><span></span><span></span>
          <em class="status" id="chat-status"></em><button class="stop" id="stop">Stop</button>
        </div></div>
      </section>
      <div id="copy-status" role="status" class="copy-status"></div>

      <button class="scroll-down" id="scroll-down" title="Scroll to bottom">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>

      <div class="suggestions" id="suggestions" aria-label="Chat suggestions" hidden>
        <button type="button" data-prefill="Set up a routine to ">Create a routine</button>
        <button type="button" data-prefill="Your job: ">Give it a job</button>
      </div>
      <form class="composer" id="composer">
        <button type="button" class="composer-plus" title="Attach">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input id="input" autocomplete="off" />
        <button type="button" class="composer-mic" title="Voice note">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </button>
        <button type="submit" class="composer-voice" title="Send" id="chat-send">
          <svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
        </button>
      </form>
      <div class="footnote"><b>SuperBot</b> · open source, self-hosted</div>

      <div class="model-bar" id="model-bar" hidden>
        <select id="model-select" title="Model"></select>
        <input id="custom-model" aria-label="Custom model identifier" title="Custom model identifier" autocomplete="off" spellcheck="false" hidden>
        <select id="effort-select" title="Reasoning effort"></select>
      </div>
    </main>

    <aside class="details" id="details" hidden></aside>

    <aside class="screen" id="screen" hidden>
      <div class="screen-bar">
        <span id="screen-title"></span>
        <button class="screen-take" id="screen-take">Take over</button>
        <button class="icon-btn" id="screen-close" title="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="screen-view">
        <iframe id="screen-frame" title="Bot screen" allow="clipboard-read; clipboard-write"></iframe>
        <div class="screen-shield" id="screen-shield" title="Click Take over to use this screen"></div>
        <div class="screen-msg" id="screen-msg" hidden></div>
      </div>
    </aside>
  </div>
  <div class="modal-backdrop" id="nb" hidden>
    <form class="modal" id="nb-form" autocomplete="off">
      <div class="modal-head">
        <h3>Create New Bot</h3>
        <button type="button" class="modal-close" id="nb-close" title="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="nb-preview" id="nb-preview"></div>
        <input class="nb-input" id="nb-name" maxlength="60" placeholder="Name your Bot" />
        <div class="nb-shapes" id="nb-shapes"></div>
        <div class="nb-colors" id="nb-colors"></div>
        <div class="nb-error" id="nb-error" hidden></div>
      </div>
      <div class="modal-foot">
        <label class="nb-runs">Runs on <select id="nb-harness"></select></label>
        <button type="button" class="nb-btn" id="nb-cancel">Cancel</button>
        <button type="submit" class="nb-btn primary" id="nb-create">Create</button>
      </div>
    </form>
  </div>
  <dialog class="modal team-dialog" id="team-dialog" aria-labelledby="team-title">
    <form id="team-form">
      <div class="modal-head"><h3 id="team-title">New team</h3></div>
      <div class="team-form-body">
        <label for="team-name">Team name</label>
        <input id="team-name" maxlength="60" required autofocus autocomplete="off" />
        <p id="team-delete-hint" hidden>Move this team’s bots before deleting it.</p>
        <p class="nb-error" id="team-error" role="alert" hidden></p>
      </div>
      <div class="modal-foot">
        <button type="button" class="nb-btn team-delete" id="team-delete" hidden>Delete team</button>
        <button type="button" class="nb-btn" id="team-cancel">Cancel</button>
        <button type="submit" class="nb-btn primary" id="team-save">Create</button>
      </div>
    </form>
  </dialog>
  <dialog class="modal team-dialog mcp-dialog" id="mcp-dialog" aria-labelledby="mcp-title">
    <div class="modal-head">
      <h3 id="mcp-title">MCP Services</h3>
      <button type="button" class="modal-close" id="mcp-close" aria-label="Close MCP Services">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="nb-error" id="mcp-error" role="alert" hidden></p>
    <div id="mcp-catalogue">
      <div class="mcp-list" id="mcp-list"></div>
      <div class="modal-foot"><button type="button" class="nb-btn primary" id="mcp-add">Add service</button></div>
    </div>
    <form id="mcp-form" hidden autocomplete="off">
      <div class="team-form-body mcp-fields">
        <label for="mcp-name">Name</label><input id="mcp-name" maxlength="60" required />
        <label for="mcp-transport">Transport</label>
        <select id="mcp-transport"><option value="http">Streamable HTTP</option><option value="stdio">Local stdio</option></select>
        <div class="mcp-fields" id="mcp-http">
          <label for="mcp-url">Endpoint URL</label><input id="mcp-url" type="url" placeholder="https://example.com/mcp" />
          <label for="mcp-bearer">Bearer credential file (optional)</label><input id="mcp-bearer" spellcheck="false" />
        </div>
        <div class="mcp-fields" id="mcp-stdio" hidden>
          <label for="mcp-command">Executable</label><input id="mcp-command" spellcheck="false" />
          <label for="mcp-args">Arguments, one per line</label><textarea id="mcp-args" rows="3" spellcheck="false"></textarea>
          <label for="mcp-env">Credential files, one VARIABLE=filename per line</label><textarea id="mcp-env" rows="3" spellcheck="false"></textarea>
        </div>
        <label class="mcp-enabled"><input type="checkbox" id="mcp-enabled" /> Globally enabled</label>
      </div>
      <div class="modal-foot">
        <button type="button" class="nb-btn" id="mcp-cancel">Cancel</button>
        <button type="submit" class="nb-btn primary" id="mcp-save">Save service</button>
      </div>
    </form>
  </dialog>
  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script src="vendor/highlight.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
  <script src="mcp.js"></script>
</body>
</html>
